# Stickio — конфигурация nginx для stickio.tumioai.ru
#
# Заменяет прежний файл: в нём не было ни сжатия, ни кэша статики, ни
# своей страницы 404, а HTTP/2 не включался.
#
# ПЕРЕД ЗАМЕНОЙ сделайте копию рабочего файла и после правки проверьте:
#     sudo cp /etc/nginx/sites-available/stickio.tumioai.ru{,.bak}
#     sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО ПРО СЕРТИФИКАТ: пути ниже — стандартные для certbot. Если HTTPS у вас
# настроен иначе (acme.sh, панель хостинга), подставьте свои пути в
# ssl_certificate и ssl_certificate_key, иначе nginx не запустится.

# --- HTTP: только перенаправление на HTTPS ------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name stickio.tumioai.ru;

    # Всё, что пришло по http, уходит на https: у поисковиков один адрес
    # страницы вместо двух, и вес не делится между ними.
    location / {
        return 301 https://$host$request_uri;
    }

    # Проверка продления сертификата должна работать и по http.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# --- HTTPS: сам сайт ----------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stickio.tumioai.ru;

    ssl_certificate     /etc/letsencrypt/live/stickio.tumioai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stickio.tumioai.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/stickio.tumioai.ru;
    index index.html;

    # Сжатие: страница и стили отдаются текстом, в сжатом виде — втрое меньше.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # Заголовки безопасности. nosniff не даёт браузеру «угадать» тип файла,
    # referrer-policy не сливает адреса наружу, frame-options запрещает
    # вставлять сайт в чужой iframe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Статика с картинками и значком не меняется — пусть лежит в кэше
    # браузера месяц, тогда повторные заходы грузятся мгновенно.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Установщик: 33 МБ, поэтому отдаём вложением и не пишем каждый запрос
    # в журнал. ranges — чтобы докачка работала.
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # HTML не кэшируем: правки на сайте должны быть видны сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Своя страница 404 вместо стандартной заглушки nginx: человек с битой
    # ссылкой получает ссылки на нужные разделы, а не серый текст.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
